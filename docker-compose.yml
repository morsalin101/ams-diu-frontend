# ==========================================================================
#  AMS-DIU Admin frontend (Vite/React static SPA served by nginx).
#  Routed by the shared nginx-proxy via VIRTUAL_HOST. No host ports needed.
# ==========================================================================
services:
  admin:
    build: .
    container_name: ams-admin
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${ADMIN_DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${ADMIN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - web

networks:
  web:
    external: true
